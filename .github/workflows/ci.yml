# Main CI: fmt, clippy, test, and cargo-audit. Checks out fiducia-interfaces
# alongside the repo so the path dependency resolves.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
          path: repo
      - name: Assert exact reviewed head
        working-directory: repo
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: repo/.github/workflows/ci.yml repo/.github/workflows/cli-flags.yml repo/.github/workflows/docker.yml
      - name: Formal routing manifest and bounded model
        working-directory: repo
        run: python3 formal/model.py
      - name: Formal routing JSON-lines adapter smoke
        working-directory: repo
        run: |
          printf '%s\n' \
            '{"op":"route","scope":"global","key":"orders/42","region":"aws","regions":["gcp","aws","hetzner"],"shard_count":16}' \
            '{"op":"route","scope":"regional","key":"orders/42","region":"aws","regions":["gcp","aws","hetzner"],"shard_count":16}' \
            | python3 formal/model.py --json-stdin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          show-progress: false
          repository: fiducia-cloud/fiducia-interfaces
          ref: bd718cd72d72aa330534f3688f8fb1ce90c19d10
          path: fiducia-interfaces
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: repo
      - name: fmt
        working-directory: repo
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: repo
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        working-directory: repo
        run: cargo test --locked --all-targets
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: audit
        working-directory: repo
        run: cargo audit
