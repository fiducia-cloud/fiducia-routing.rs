name: tmp format routing crate

on:
  push:
    branches:
      - feat/tenant-lock-coordination-domains

permissions:
  contents: write

concurrency:
  group: tmp-format-routing
  cancel-in-progress: false

jobs:
  format-and-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/tenant-lock-coordination-domains
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all -- --check
          git diff --check
          test -n "$(git diff -- src/lib.rs)"
      - name: Commit formatted source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'automation@users.noreply.github.com'
          git rm .github/workflows/tmp-format-routing.yml
          git add src/lib.rs
          git commit -m 'style: format routing crate with Rust 1.95'
          git push origin HEAD:feat/tenant-lock-coordination-domains
