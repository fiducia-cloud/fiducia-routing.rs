name: weighted-hrw source regression
on:
  pull_request:
    paths:
      - 'src/weighted_rendezvous.rs'
      - '.github/workflows/weighted-hrw-reference.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Execute exact checked-out regression
        run: |
          set -euo pipefail
          rustc --edition=2021 --test src/weighted_rendezvous.rs -o "$RUNNER_TEMP/hrw" && "$RUNNER_TEMP/hrw"
